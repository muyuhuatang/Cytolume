name: Deploy Cytolume to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source and frozen anatomy snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read Pages URL
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
          cache: pip
          cache-dependency-path: web/spine/requirements.txt

      - name: Install locked dependencies
        run: |
          npm ci
          python -m pip install -r spine/requirements.txt

      - name: Generate and verify all four synthetic cell layouts
        run: python -m spine.export.build_all

      - name: Verify local anatomy routing
        run: npm run test:hra

      - name: Build the website and verify the frozen anatomy snapshot
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build:app

      - name: Upload the complete static website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web/dist-app

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
